name: Sync upstream changes

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: Part-DB/Part-DB-server
  SYNC_BRANCH: chore/automated-upstream-sync

jobs:
  sync:
    name: Merge upstream/master
    runs-on: [self-hosted, linux, x64, aglelectronics]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch upstream changes
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream master

          if git merge-base --is-ancestor upstream/master origin/master; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the sync branch
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin \
            "${SYNC_BRANCH}:refs/remotes/origin/${SYNC_BRANCH}" || true
          git switch --force-create "$SYNC_BRANCH" origin/master
          git merge --no-ff upstream/master \
            -m "Merge upstream/master into ${SYNC_BRANCH}"
          git push --force-with-lease origin "$SYNC_BRANCH"

      - name: Create or update the pull request
        if: steps.upstream.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pr_number="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --head "$SYNC_BRANCH" \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" \
              --repo "$GITHUB_REPOSITORY" \
              --title "chore: sync upstream changes" \
              --body "Automated daily merge of \`${UPSTREAM_REPOSITORY}:master\`."
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base master \
              --head "$SYNC_BRANCH" \
              --title "chore: sync upstream changes" \
              --body "Automated daily merge of \`${UPSTREAM_REPOSITORY}:master\`."
          fi
