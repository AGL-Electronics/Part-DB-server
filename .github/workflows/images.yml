name: CI/CD

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - 'mechanical-v*'
      - '*.*.*-*'
  workflow_dispatch:
    inputs:
      deploy:
        description: Stack to deploy. none only builds. dev is started by hand.
        required: true
        default: none
        type: choice
        options:
          - none
          - dev
          - prod
      image_tag:
        description: Tag to deploy, such as 2.20.0-1, master, sha-abc1234, or pr-12. Empty uses master.
        required: false
        type: string
      rebuild:
        description: Build the image before deploying
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write
  actions: write

concurrency:
  group: cicd-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ github.event.inputs.deploy || 'auto' }}
  cancel-in-progress: true

jobs:
  test-image:
    name: Test image
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, linux, x64, aglelectronics]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/agl-electronics/part-db-server
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=pr-${{ github.event.pull_request.number }}
          labels: |
            org.opencontainers.image.title=Part-DB test image
            org.opencontainers.image.description=Part-DB image built to try a pull request
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Build and publish test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=test-image
          cache-to: type=gha,mode=max,scope=test-image

  release-image:
    name: Release image (${{ matrix.slug }})
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref_type == 'tag')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.deploy == 'none' || inputs.rebuild))
    runs-on: [self-hosted, linux, x64, aglelectronics]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: amd64
          - platform: linux/arm64
            slug: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate release image tag
        if: github.ref_type == 'tag' && !startsWith(github.ref, 'refs/tags/mechanical-v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-([1-9][0-9]*)$ ]]; then
            echo "::error::Release image tag '$RELEASE_TAG' must use <upstream-version>-<fork-release>, for example 2.20.0-1."
            exit 1
          fi

          tag_upstream_version="${BASH_REMATCH[1]}"
          upstream_version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$tag_upstream_version" != "$upstream_version" ]]; then
            echo "::error::Release image tag '$RELEASE_TAG' claims upstream $tag_upstream_version, but VERSION contains $upstream_version."
            exit 1
          fi

      - name: Set up QEMU
        if: matrix.platform != 'linux/amd64'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/agl-electronics/part-db-server
          labels: |
            org.opencontainers.image.title=Part-DB
            org.opencontainers.image.description=Part-DB with the mechanical parts library
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Build and publish release image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/agl-electronics/part-db-server,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            PARTDB_BUILD_VERSION=${{ github.ref_type == 'tag' && github.ref_name || '' }}
          cache-from: type=gha,scope=prod-image-${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=prod-image-${{ matrix.slug }}
          provenance: mode=max
          sbom: true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: release-digest-${{ matrix.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  release-manifest:
    name: Publish release image
    needs: release-image
    if: needs.release-image.result == 'success'
    runs-on: [self-hosted, linux, x64, aglelectronics]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: release-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/agl-electronics/part-db-server
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=master,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=mechanical-preview,enable=${{ github.ref == 'refs/heads/master' }}
            type=ref,event=tag
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.image_tag != '' }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              args+=(-t "$tag")
            fi
          done <<< "$TAGS"
          for digest in *; do
            args+=("ghcr.io/agl-electronics/part-db-server@sha256:${digest}")
          done
          docker buildx imagetools create "${args[@]}"

  deploy-prod:
    name: Deploy production
    needs: release-manifest
    if: >-
      always() &&
      (
        (
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/master' || github.ref_type == 'tag') &&
          needs.release-manifest.result == 'success'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.deploy == 'prod' &&
          (
            needs.release-manifest.result == 'success' ||
            (needs.release-manifest.result == 'skipped' && inputs.rebuild == false)
          )
        )
      )
    runs-on: [self-hosted, linux, x64, aglelectronics]
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Deploy production stack
        uses: ./.github/actions/deploy-stack
        with:
          compose-file: compose.preview.yaml
          remote-path: /opt/partdb/prod
          image-tag: ${{ github.ref_type == 'tag' && github.ref_name || inputs.image_tag || 'master' }}
          host: ${{ secrets.DEPLOY_HOST }}
          user: ${{ secrets.DEPLOY_USER }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          ghcr-user: ${{ secrets.GHCR_PULL_USER }}
          ghcr-token: ${{ secrets.GHCR_PULL_TOKEN }}

  deploy-dev:
    name: Deploy dev
    needs: release-manifest
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy == 'dev' &&
      (
        needs.release-manifest.result == 'success' ||
        (needs.release-manifest.result == 'skipped' && inputs.rebuild == false)
      )
    runs-on: [self-hosted, linux, x64, aglelectronics]
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Deploy dev stack
        uses: ./.github/actions/deploy-stack
        with:
          compose-file: deploy/compose.dev.yaml
          remote-path: /opt/partdb/dev
          image-tag: ${{ inputs.image_tag || 'master' }}
          host: ${{ secrets.DEPLOY_HOST }}
          user: ${{ secrets.DEPLOY_USER }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          ghcr-user: ${{ secrets.GHCR_PULL_USER }}
          ghcr-token: ${{ secrets.GHCR_PULL_TOKEN }}
